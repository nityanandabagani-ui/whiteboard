<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<link rel="manifest" href="manifest.json">
<title>নোটিফিকেশন বোর্ড</title>
<style>
:root{--bg:#f1f3f6;--panel:#fff;--tx:#1d2330;--bd:#d8dce4;--ac:#2563eb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171d;--panel:#1f242d;--tx:#e8ebf0;--bd:#343b48;--ac:#5b8cff}}
:root[data-theme="dark"]{--bg:#14171d;--panel:#1f242d;--tx:#e8ebf0;--bd:#343b48;--ac:#5b8cff}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:"Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif;display:flex;gap:8px;padding:8px;overflow:hidden}
#tools{width:156px;flex:none;background:var(--panel);border:1px solid var(--bd);border-radius:14px;padding:6px;display:grid;grid-template-columns:1fr 1fr;gap:5px;align-content:start;overflow-y:auto}
.f{grid-column:1/-1}
#main{flex:1;min-width:0;display:flex;align-items:center;justify-content:center}
#box{width:100%;max-width:calc((100vh - 24px)*16/9);aspect-ratio:16/9;background:#fff;border:2px solid var(--bd);border-radius:10px;overflow:hidden;position:relative;box-shadow:0 4px 18px rgba(0,0,0,.12)}
canvas{width:100%;height:100%;display:block;touch-action:none}
button,label.b{font:inherit;font-size:12px;border:1px solid var(--bd);background:var(--panel);color:var(--tx);border-radius:9px;padding:7px 2px;cursor:pointer;text-align:center;display:block;margin:0}
button:hover,label.b:hover{border-color:var(--ac)}
button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
#up{background:var(--ac);color:#fff;border-color:var(--ac)}
#rec.on{background:#dc2626;border-color:#dc2626}
.cols{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.cols i{height:24px;border-radius:50%;border:2px solid var(--bd);cursor:pointer}
.cols i.on{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac)}
input[type=range]{width:100%;margin:2px 0}
#pg{display:none;grid-template-columns:1fr auto 1fr;gap:5px;align-items:center;font-size:12px;text-align:center}
#hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#9aa1ad;font-size:clamp(14px,2.2vw,26px);pointer-events:none;text-align:center;padding:20px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:9}
#modal div{background:var(--panel);padding:12px;border-radius:12px;width:min(560px,92vw);display:grid;gap:8px}
#modal video{width:100%;border-radius:8px;background:#000}
#modal .r{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (orientation:portrait){body{flex-direction:column-reverse}#main{flex:none;width:100%;align-items:flex-start}#box{max-width:100%}#tools{width:100%;flex:1;min-height:0;grid-template-columns:repeat(4,1fr)}#up,#np,#rec,#mic,#clr,#nb{grid-column:span 2}button,label.b{font-size:11px;padding:7px 1px}}
</style>
</head>
<body>
<div id="tools">
<label class="b" id="up">📂 আপলোড<input id="file" type="file" accept="image/*,application/pdf" multiple hidden></label>
<button id="np">➕ নতুন পাতা</button>
<button data-t="pen" class="on">✏️ কলম</button>
<button data-t="eraser">🧽 রাবার</button>
<button data-t="hand">✋ সরান</button>
<button id="zr">১০০%</button>
<button id="zi">➕ জুম</button>
<button id="zo">➖ জুম</button>
<input class="f" id="size" type="range" min="2" max="24" value="5" title="কলম মোটা-চিকন">
<button id="rec">⏺ রেকর্ড</button>
<button id="mic">🎤 মাইক বন্ধ</button>
<div id="pg" class="f"><button id="pp">◀</button><span id="pn"></span><button id="pnx">▶</button></div>
<div class="cols f" id="cols"></div>
<button id="undo">↶ আনডু</button>
<button id="redo">↷ রিডু</button>
<button data-t="rect">▭ চারকোণা</button>
<button data-t="circle">◯ গোল</button>
<button data-t="triangle">△ ত্রিভুজ</button>
<button data-t="line">╱ রেখা</button>
<button id="clr">🧹 পাতা মুছুন</button>
<button id="nb">🆕 নতুন বোর্ড</button>
<button id="pdfb" class="f">📄 পিডিএফ সেভ করুন</button>
</div>
<div id="main"><div id="box"><canvas id="c" width="1920" height="1080"></canvas><div id="hint">উপরের বোতাম থেকে PDF বা ছবি আপলোড করুন, অথবা সরাসরি লিখুন</div></div></div>
<div id="modal"><div><video id="pv" controls playsinline></video><div class="r"><button id="mdl">⬇ ডাউনলোড</button><button id="mcl">বন্ধ করুন</button></div></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
const W=1920,H=1080,cv=document.getElementById('c'),ctx=cv.getContext('2d');
const layer=document.createElement('canvas');layer.width=W;layer.height=H;const lc=layer.getContext('2d');
const COLORS=['#111111','#e11d48','#2563eb','#16a34a','#f59e0b','#7c3aed','#0891b2','#ffffff'];
const $=id=>document.getElementById(id);
const blank=()=>({bg:null,acts:[],redo:[]});
let tool='pen',color=COLORS[0],size=5,pages=[blank()],pi=0,view={z:1,x:0,y:0},cur=null,pan=null,pinch=null;const ptrs=new Map();
const P=()=>pages[pi];

COLORS.forEach((c,i)=>{const e=document.createElement('i');e.style.background=c;if(!i)e.className='on';e.onclick=()=>{color=c;[...$('cols').children].forEach(x=>x.classList.remove('on'));e.classList.add('on');if(tool==='eraser'||tool==='hand')setTool('pen')};$('cols').appendChild(e)});
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>setTool(b.dataset.t));
function setTool(t){tool=t;document.querySelectorAll('[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===t));cv.style.cursor=t==='hand'?'grab':'crosshair'}
$('size').oninput=e=>size=+e.target.value;

function clamp(){view.z=Math.max(1,Math.min(6,view.z));view.x=Math.min(0,Math.max(W-W*view.z,view.x));view.y=Math.min(0,Math.max(H-H*view.z,view.y))}
function zoom(f,cx=W/2,cy=H/2){const wx=(cx-view.x)/view.z,wy=(cy-view.y)/view.z;view.z*=f;clamp();view.x=cx-wx*view.z;view.y=cy-wy*view.z;clamp();render()}
$('zi').onclick=()=>zoom(1.25);$('zo').onclick=()=>zoom(0.8);$('zr').onclick=()=>{view={z:1,x:0,y:0};render()};

function path(c,a){
 c.globalCompositeOperation=a.er?'destination-out':'source-over';
 c.strokeStyle=a.col;c.lineWidth=a.w;c.lineCap=c.lineJoin='round';c.beginPath();
 const p=a.pts,[x0,y0]=p[0],[x1,y1]=p[p.length-1];
 if(a.t==='stroke'){c.moveTo(x0,y0);if(p.length<2)c.lineTo(x0+.1,y0);for(const q of p)c.lineTo(q[0],q[1])}
 else if(a.t==='rect')c.rect(x0,y0,x1-x0,y1-y0);
 else if(a.t==='circle')c.ellipse((x0+x1)/2,(y0+y1)/2,Math.abs(x1-x0)/2,Math.abs(y1-y0)/2,0,0,7);
 else if(a.t==='triangle'){c.moveTo((x0+x1)/2,y0);c.lineTo(x1,y1);c.lineTo(x0,y1);c.closePath()}
 else if(a.t==='line'){c.moveTo(x0,y0);c.lineTo(x1,y1)}
 c.stroke();
}
function drawPage(c,l,p,all,S,v){
 c.setTransform(1,0,0,1,0,0);c.fillStyle='#fff';c.fillRect(0,0,W*S,H*S);
 const T=[S*v.z,0,0,S*v.z,S*v.x,S*v.y];c.setTransform(...T);
 const bg=p.bg;
 if(bg){const k=Math.min(W/bg.w,H/bg.h),dw=bg.w*k,dh=bg.h*k;c.drawImage(bg.src,(W-dw)/2,(H-dh)/2,dw,dh)}
 l.setTransform(1,0,0,1,0,0);l.clearRect(0,0,W*S,H*S);l.setTransform(...T);
 for(const a of all)path(l,a);
 c.setTransform(1,0,0,1,0,0);c.drawImage(l.canvas,0,0);
}
function render(){
 const p=P(),all=cur?[...p.acts,cur]:p.acts;
 drawPage(ctx,lc,p,all,1,view);
 $('hint').style.display=(p.bg||all.length||pages.length>1||p.load)?'none':'flex';
}
function pt(e){const r=cv.getBoundingClientRect(),k=W/r.width,sx=(e.clientX-r.left)*k,sy=(e.clientY-r.top)*k;return{sx,sy,x:(sx-view.x)/view.z,y:(sy-view.y)/view.z}}
cv.addEventListener('pointerdown',e=>{
 cv.setPointerCapture(e.pointerId);const p=pt(e);
 ptrs.set(e.pointerId,{sx:p.sx,sy:p.sy});
 if(ptrs.size===2){cur=null;pan=null;const [a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.sx-b.sx,a.sy-b.sy)||1,mx:(a.sx+b.sx)/2,my:(a.sy+b.sy)/2};render();return}
 if(pinch)return;
 if(tool==='hand'){pan={sx:p.sx,sy:p.sy,vx:view.x,vy:view.y};cv.style.cursor='grabbing';return}
 const er=tool==='eraser';
 cur={t:(tool==='pen'||er)?'stroke':tool,er,col:color,w:er?size*4:size,pts:[[p.x,p.y],[p.x,p.y]]};
 render();
});
cv.addEventListener('pointermove',e=>{
 const p=pt(e);
 if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{sx:p.sx,sy:p.sy});
 if(pinch){if(ptrs.size>=2){const [a,b]=[...ptrs.values()],d=Math.hypot(a.sx-b.sx,a.sy-b.sy)||1,mx=(a.sx+b.sx)/2,my=(a.sy+b.sy)/2,wx=(pinch.mx-view.x)/view.z,wy=(pinch.my-view.y)/view.z;view.z=Math.max(1,Math.min(6,view.z*d/pinch.d));view.x=mx-wx*view.z;view.y=my-wy*view.z;clamp();pinch={d,mx,my};render()}return}
 if(pan){view.x=pan.vx+(p.sx-pan.sx);view.y=pan.vy+(p.sy-pan.sy);clamp();render();return}
 if(!cur)return;
 if(cur.t==='stroke')cur.pts.push([p.x,p.y]);else cur.pts[1]=[p.x,p.y];
 render();
});
const end=e=>{if(e&&ptrs.has(e.pointerId))ptrs.delete(e.pointerId);if(pinch){if(ptrs.size<2)pinch=null;return}if(pan){pan=null;cv.style.cursor='grab'}if(cur){P().acts.push(cur);cur=null;P().redo=[];render()}};
cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
cv.addEventListener('wheel',e=>{e.preventDefault();const p=pt(e);zoom(e.deltaY<0?1.15:0.87,p.sx,p.sy)},{passive:false});

$('undo').onclick=()=>{const p=P();if(p.acts.length){p.redo.push(p.acts.pop());render()}};
$('redo').onclick=()=>{const p=P();if(p.redo.length){p.acts.push(p.redo.pop());render()}};
$('clr').onclick=()=>{if(P().acts.length&&confirm('এই পাতার লেখা মুছে ফেলবেন?')){P().acts=[];P().redo=[];render()}};
$('nb').onclick=()=>{if(confirm('সব পাতা মুছে সম্পূর্ণ নতুন বোর্ড শুরু করবেন?')){pages=[blank()];pi=0;view={z:1,x:0,y:0};updPg();render()}};

function updPg(){$('pg').style.display=pages.length>1?'grid':'none';$('pn').textContent=(pi+1)+' / '+pages.length}
async function showPage(i){
 if(i<0||i>=pages.length)return;pi=i;const p=P();cur=null;updPg();
 if(!p.bg&&p.load){render();try{await p.load()}catch(e){console.error(e)}}
 if(pages[pi]===p)render();
}
$('pp').onclick=()=>showPage(pi-1);$('pnx').onclick=()=>showPage(pi+1);

function pdfPage(d,n){const p=blank();p.load=async()=>{
 const pg=await d.getPage(n),v0=pg.getViewport({scale:1}),sc=Math.min(2400/v0.width,2400/v0.height,3),vp=pg.getViewport({scale:sc});
 const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;
 await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;p.bg={src:c,w:c.width,h:c.height};p.load=null};return p}
function loadImg(f){return new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=URL.createObjectURL(f)})}
$('file').onchange=async e=>{
 const fs=[...e.target.files];e.target.value='';if(!fs.length)return;
 const np=[];
 for(const f of fs){
  try{
   if(f.type==='application/pdf'||/\.pdf$/i.test(f.name)){
    pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const d=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;
    for(let n=1;n<=d.numPages;n++)np.push(pdfPage(d,n));
   }else{const i=await loadImg(f),p=blank();p.bg={src:i,w:i.naturalWidth,h:i.naturalHeight};np.push(p)}
  }catch(err){alert('"'+f.name+'" খোলা যায়নি')}
 }
 if(!np.length)return;
 const empty=pages.length===1&&!pages[0].bg&&!pages[0].acts.length;
 const start=empty?0:pages.length;pages=empty?np:pages.concat(np);showPage(start);
};

// recording (only the 16:9 board)
let mr=null,chunks=[],tm=null,t0=0,micOn=false,last=null;
$('mic').onclick=()=>{micOn=!micOn;$('mic').classList.toggle('on',micOn);$('mic').textContent=micOn?'🎤 মাইক চালু':'🎤 মাইক বন্ধ'};
async function save(blob,name){
 try{const d=window.claude&&await claude.use('downloads');if(d){await d.save({filename:name,data:blob});return}}catch(e){if(e&&e.code==='declined')return}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
}
$('rec').onclick=async()=>{
 if(mr){mr.stop();return}
 if(!window.MediaRecorder||!cv.captureStream){alert('এই ব্রাউজারে রেকর্ড চলবে না, Chrome ব্যবহার করুন');return}
 const stream=cv.captureStream(30);
 if(micOn){try{const a=await navigator.mediaDevices.getUserMedia({audio:true});a.getAudioTracks().forEach(t=>stream.addTrack(t))}catch(err){alert('মাইক চালু করা যায়নি, ভয়েস ছাড়া রেকর্ড হবে')}}
 const mt=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm','video/mp4'].find(t=>MediaRecorder.isTypeSupported(t));
 if(!mt){alert('রেকর্ড সাপোর্ট নেই');return}
 mr=new MediaRecorder(stream,{mimeType:mt,videoBitsPerSecond:8e6});chunks=[];
 mr.ondataavailable=e=>e.data.size&&chunks.push(e.data);
 mr.onstop=()=>{clearInterval(tm);stream.getTracks().forEach(t=>t.stop());mr=null;$('rec').textContent='⏺ রেকর্ড';$('rec').classList.remove('on');
  const blob=new Blob(chunks,{type:mt});last={blob,name:'board-'+Date.now()+(mt.includes('mp4')?'.mp4':'.webm')};
  $('pv').src=URL.createObjectURL(blob);$('modal').style.display='flex'};
 mr.start(1000);t0=Date.now();$('rec').classList.add('on');
 tm=setInterval(()=>{const s=Math.floor((Date.now()-t0)/1000);$('rec').textContent='⏹ '+String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},500);
};
$('mdl').onclick=()=>last&&save(last.blob,last.name);
$('mcl').onclick=()=>{$('modal').style.display='none';$('pv').pause()};

$('np').onclick=()=>{pages.splice(pi+1,0,blank());showPage(pi+1)};

async function makePDF(){
 const S=2,imgs=[],c=document.createElement('canvas'),l=document.createElement('canvas');
 c.width=l.width=W*S;c.height=l.height=H*S;const cc=c.getContext('2d'),ll=l.getContext('2d');
 for(const p of pages){
  if(!p.bg&&p.load)await p.load();
  drawPage(cc,ll,p,p.acts,S,{z:1,x:0,y:0});
  const b=atob(c.toDataURL('image/jpeg',0.9).split(',')[1]),u=new Uint8Array(b.length);
  for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);imgs.push(u);
 }
 const enc=new TextEncoder(),parts=[],offs=[];let len=0;
 const add=b=>{if(typeof b==='string')b=enc.encode(b);parts.push(b);len+=b.length};
 const obj=(i,t)=>{offs[i]=len;add(i+' 0 obj\n'+t+'\nendobj\n')};
 const n=imgs.length;add('%PDF-1.4\n');
 obj(1,'<</Type/Catalog/Pages 2 0 R>>');
 obj(2,'<</Type/Pages/Kids ['+imgs.map((_,k)=>(3+k*3)+' 0 R').join(' ')+']/Count '+n+'>>');
 imgs.forEach((im,k)=>{const pg=3+k*3,ct=pg+1,ig=pg+2,cs='q 960 0 0 540 0 0 cm /Im0 Do Q';
  obj(pg,'<</Type/Page/Parent 2 0 R/MediaBox[0 0 960 540]/Contents '+ct+' 0 R/Resources<</XObject<</Im0 '+ig+' 0 R>>>>>>');
  obj(ct,'<</Length '+cs.length+'>>\nstream\n'+cs+'\nendstream');
  offs[ig]=len;add(ig+' 0 obj\n<</Type/XObject/Subtype/Image/Width '+c.width+'/Height '+c.height+'/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length '+im.length+'>>\nstream\n');add(im);add('\nendstream\nendobj\n');
 });
 const total=3*n+3,xr=len;let x='xref\n0 '+total+'\n0000000000 65535 f \n';
 for(let i=1;i<total;i++)x+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
 add(x+'trailer\n<</Size '+total+'/Root 1 0 R>>\nstartxref\n'+xr+'\n%%EOF');
 return new Blob(parts,{type:'application/pdf'});
}
$('pdfb').onclick=async()=>{
 const b=$('pdfb');b.textContent='⏳ তৈরি হচ্ছে...';b.disabled=true;
 try{await save(await makePDF(),'board-'+Date.now()+'.pdf')}catch(e){alert('পিডিএফ তৈরি হয়নি');console.error(e)}
 b.textContent='📄 পিডিএফ সেভ করুন';b.disabled=false;
};

try{if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
setTool('pen');render();
</script>
</body>
</html>
